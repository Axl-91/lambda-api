services:
  dynamodb:
    image: amazon/dynamodb-local
    user: root
    ports:
      - "8000:8000"
    command: >
      -jar DynamoDBLocal.jar
      -sharedDb
      -dbPath /home/dynamodblocal/data
    volumes:
      - dynamodb-data:/home/dynamodblocal/data
    networks:
      - lambda-api

  dynamodb-init:
    image: amazon/aws-cli
    depends_on:
      - dynamodb
    environment:
      AWS_ACCESS_KEY_ID: dummy
      AWS_SECRET_ACCESS_KEY: dummy
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./docker/dynamodb/init.sh:/init.sh:ro
    networks:
      - lambda-api
    entrypoint:
      - /bin/sh
      - /init.sh

  minio:
    image: minio/minio
    command: server /data
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: dummy
      MINIO_ROOT_PASSWORD: dummy123
      MINIO_NOTIFY_WEBHOOK_ENABLE_S3BRIDGE: "on"
      MINIO_NOTIFY_WEBHOOK_ENDPOINT_S3BRIDGE: "http://host.docker.internal:4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - minio-data:/data
    networks:
      - lambda-api

  s3-init:
    build:
      context: ./docker/s3
      dockerfile: Dockerfile
    depends_on:
      - minio
    environment:
      AWS_ACCESS_KEY_ID: dummy
      AWS_SECRET_ACCESS_KEY: dummy123
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./docker/s3/init.sh:/init.sh:ro
    networks:
      - lambda-api
    entrypoint:
      - /bin/sh
      - /init.sh

  elasticmq:
    image: softwaremill/elasticmq-native
    ports:
      - "9324:9324"
      - "9325:9325"
    volumes:
      - ./docker/sqs/elasticmq.conf:/opt/elasticmq.conf
    networks:
      - lambda-api

networks:
  lambda-api:
    external: true
    name: lambda-api

volumes:
  dynamodb-data:
  minio-data:
