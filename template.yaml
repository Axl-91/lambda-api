AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  lambda-api

  Sample SAM for lambda API

Globals:
  Function:
    Timeout: 3

    Tracing: Active
    LoggingConfig:
      LogFormat: JSON
  Api:
    TracingEnabled: true
Resources:
  LoyaltyCardsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: LoyaltyCards
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
  GetLoyaltyCardsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/handlers/get-loyalty-cards.getLoyaltyCards
      Runtime: nodejs22.x
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref LoyaltyCardsTable
      Environment:
        Variables:
          LOYALTY_CARDS_TABLE: LoyaltyCards
          DYNAMODB_ENDPOINT: http://dynamodb:8000
      Events:
        GetLoyaltyCard:
          Type: Api
          Properties:
            Path: /loyalty-cards
            Method: get
    Metadata: # Manage esbuild properties
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2020
        Sourcemap: true
        EntryPoints:
        - src/handlers/get-loyalty-cards.ts
  GetLoyaltyCardFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/handlers/get-loyalty-card.getLoyaltyCard
      Runtime: nodejs22.x
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref LoyaltyCardsTable
      Environment:
        Variables:
          LOYALTY_CARDS_TABLE: LoyaltyCards
          DYNAMODB_ENDPOINT: http://dynamodb:8000
      Events:
        GetLoyaltyCard:
          Type: Api
          Properties:
            Path: /loyalty-cards/{id}
            Method: get
    Metadata: # Manage esbuild properties
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2020
        Sourcemap: true
        EntryPoints:
        - src/handlers/get-loyalty-card.ts
  CreateLoyaltyCardFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/handlers/create-loyalty-card.createLoyaltyCard
      Runtime: nodejs22.x
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref LoyaltyCardsTable
      Environment:
        Variables:
          LOYALTY_CARDS_TABLE: LoyaltyCards
          DYNAMODB_ENDPOINT: http://dynamodb:8000
      Events:
        CreateLoyaltyCard:
          Type: Api
          Properties:
            Path: /loyalty-cards
            Method: post
    Metadata: # Manage esbuild properties
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2020
        Sourcemap: true
        EntryPoints:
        - src/handlers/create-loyalty-card.ts
  ImportLoyaltyCardsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/handlers/import-loyalty-cards.importLoyaltyCards
      Runtime: nodejs22.x
      Environment:
        Variables:
          S3_ENDPOINT: http://minio:9000
          AWS_ACCESS_KEY_ID: dummy
          AWS_SECRET_ACCESS_KEY: dummy123
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2020
        Sourcemap: true
        EntryPoints:
          - src/handlers/import-loyalty-cards.ts

  ApplicationResourceGroup:
    Type: AWS::ResourceGroups::Group
    Properties:
      Name:
        Fn::Sub: ApplicationInsights-SAM-${AWS::StackName}
      ResourceQuery:
        Type: CLOUDFORMATION_STACK_1_0
  ApplicationInsightsMonitoring:
    Type: AWS::ApplicationInsights::Application
    Properties:
      ResourceGroupName:
        Ref: ApplicationResourceGroup
      AutoConfigurationEnabled: 'true'

