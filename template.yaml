AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Loyalty cards API and CSV import pipeline.

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 3

Resources:
  LoyaltyCardsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: LoyaltyCards
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  GetLoyaltyCardsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/handlers/get-loyalty-cards.getLoyaltyCards
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref LoyaltyCardsTable
      Environment:
        Variables:
          LOYALTY_CARDS_TABLE: LoyaltyCards
          DYNAMODB_ENDPOINT: http://dynamodb:8000
      Events:
        GetLoyaltyCards:
          Type: Api
          Properties:
            Path: /loyalty-cards
            Method: get
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2020
        Sourcemap: true
        EntryPoints:
          - src/handlers/get-loyalty-cards.ts

  GetLoyaltyCardFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/handlers/get-loyalty-card.getLoyaltyCard
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref LoyaltyCardsTable
      Environment:
        Variables:
          LOYALTY_CARDS_TABLE: LoyaltyCards
          DYNAMODB_ENDPOINT: http://dynamodb:8000
      Events:
        GetLoyaltyCard:
          Type: Api
          Properties:
            Path: /loyalty-cards/{id}
            Method: get
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2020
        Sourcemap: true
        EntryPoints:
          - src/handlers/get-loyalty-card.ts

  CreateLoyaltyCardFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/handlers/create-loyalty-card.createLoyaltyCard
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref LoyaltyCardsTable
      Environment:
        Variables:
          LOYALTY_CARDS_TABLE: LoyaltyCards
          DYNAMODB_ENDPOINT: http://dynamodb:8000
      Events:
        CreateLoyaltyCard:
          Type: Api
          Properties:
            Path: /loyalty-cards
            Method: post
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2020
        Sourcemap: true
        EntryPoints:
          - src/handlers/create-loyalty-card.ts

  ImportLoyaltyCardsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/handlers/import-loyalty-cards.importLoyaltyCards
      Environment:
        Variables:
          S3_ENDPOINT: http://minio:9000
          SQS_ENDPOINT: http://elasticmq:9324
          SQS_QUEUE_URL: http://elasticmq:9324/000000000000/loyalty-cards
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2020
        Sourcemap: true
        EntryPoints:
          - src/handlers/import-loyalty-cards.ts

  ProcessLoyaltyCardFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/handlers/process-loyalty-card.processLoyaltyCard
      Environment:
        Variables:
          DYNAMODB_ENDPOINT: http://dynamodb:8000
          LOYALTY_CARDS_TABLE: LoyaltyCards
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref LoyaltyCardsTable
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2020
        Sourcemap: true
        EntryPoints:
          - src/handlers/process-loyalty-card.ts
